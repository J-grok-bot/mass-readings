<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Mass Readings</title>
<meta name="description" content="Today's Catholic Mass readings, every day.">
<meta name="theme-color" content="#faf7f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16140f" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mass Readings">
<meta name="application-name" content="Mass Readings">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<style>
  :root{
    --bg:#faf7f2; --fg:#211d17; --muted:#7a7064; --accent:#8a2b2b; --rule:#e6dfd3; --card:#fffdf9;
    --serif: "Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
    --sans: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#16140f; --fg:#ece6db; --muted:#9d9385; --accent:#d9a46a; --rule:#2e2a22; --card:#1d1a15; }
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--serif);font-size:19px;line-height:1.62;
       padding:env(safe-area-inset-top) env(safe-area-inset-right) calc(var(--tabh) + env(safe-area-inset-bottom)) env(safe-area-inset-left)}
  :root{--tabh:58px}
  main{max-width:640px;margin:0 auto;padding:0 22px 40px}
  header{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--rule);
         padding:12px 14px 6px}
  .nav{display:flex;align-items:center;justify-content:space-between;gap:8px;max-width:640px;margin:0 auto}
  .nav > button{appearance:none;border:1px solid var(--rule);background:var(--card);color:var(--fg);
       width:40px;height:40px;border-radius:50%;font-size:20px;line-height:1;cursor:pointer;flex:none;
       font-family:var(--sans);display:grid;place-items:center}
  .nav > button:active{transform:scale(.95)}
  .when{text-align:center;flex:1;min-width:0}
  .date{font-family:var(--sans);font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .today-link{font-family:var(--sans);font-size:12px;color:var(--accent);background:none;border:0;padding:2px 6px;cursor:pointer;visibility:hidden}
  .today-link.show{visibility:visible}
  h1{font-size:26px;line-height:1.25;font-weight:600;margin:26px 0 4px;text-align:center;text-wrap:balance}
  .memorial{font-style:italic;color:var(--muted);text-align:center;font-size:16px;margin:0 0 6px}
  section{padding:22px 0 6px;border-top:1px solid var(--rule);margin-top:22px}
  section:first-of-type{border-top:0;margin-top:6px}
  h2{font-family:var(--sans);font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin:0 0 2px;font-weight:700}
  .cite{font-family:var(--sans);font-size:14px;color:var(--muted);margin:0 0 12px}
  .text p{margin:0 0 .9em}
  .prose p{margin:0 0 .55em}
  .psalm .text p{padding-left:1.2em;text-indent:-1.2em}
  .response{font-style:italic;margin:0 0 14px}
  .response b{font-style:normal;font-family:var(--sans);font-size:13px;color:var(--accent);margin-right:6px}
  .acclamation .text{font-style:italic}
  .status{text-align:center;color:var(--muted);font-family:var(--sans);font-size:15px;padding:60px 10px}
  .status button{margin-top:12px;font:inherit;padding:8px 16px;border-radius:20px;border:1px solid var(--rule);background:var(--card);color:var(--fg)}
  footer{font-family:var(--sans);font-size:12px;color:var(--muted);text-align:center;margin-top:30px;padding-top:18px;border-top:1px solid var(--rule);line-height:1.5}
  footer a{color:inherit}
  .note{font-family:var(--sans);font-size:12px;color:var(--muted);margin-top:-4px}
  [hidden]{display:none!important}
  /* bottom tab bar */
  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:center;
          background:var(--bg);background:color-mix(in srgb, var(--bg) 92%, transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
          border-top:1px solid var(--rule);padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  .tabbar button{appearance:none;flex:1;max-width:220px;height:var(--tabh);border:0;background:none;color:var(--muted);cursor:pointer;
          font-family:var(--sans);font-size:11px;font-weight:600;letter-spacing:.03em;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
          -webkit-tap-highlight-color:transparent}
  .tabbar svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .tabbar button[aria-selected="true"]{color:var(--accent)}
  /* Mass Parts */
  .title{font-family:var(--sans);font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:center;line-height:40px}
  .jump{display:flex;gap:6px;overflow-x:auto;max-width:640px;margin:2px auto 0;padding:2px 0 4px;scrollbar-width:none}
  .jump::-webkit-scrollbar{display:none}
  .jump button{flex:none;font-family:var(--sans);font-size:13px;font-weight:600;color:var(--fg);background:var(--card);border:1px solid var(--rule);
          border-radius:16px;padding:5px 12px;cursor:pointer;white-space:nowrap}
  .jump button:active{transform:scale(.96)}
  .rite{scroll-margin-top:100px}
  .rite h3{font-size:24px;line-height:1.25;font-weight:600;text-align:center;margin:28px 0 8px}
  .parts-intro{font-family:var(--sans);font-size:13px;color:var(--muted);text-align:center;margin:18px 0 0}
  .parts-intro b{color:var(--fg)}
  details{border-top:1px solid var(--rule)}
  .rite details:last-child{border-bottom:1px solid var(--rule)}
  summary{list-style:none;cursor:pointer;padding:14px 0 12px;font-family:var(--sans);font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;
          color:var(--accent);font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:10px}
  summary::-webkit-details-marker{display:none}
  summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);
          margin:0 4px 4px 0;transition:transform .15s;flex:none}
  details:not([open]) summary::after{transform:rotate(-45deg);margin-bottom:0}
  .lines{padding:0 0 14px}
  .ln{display:grid;grid-template-columns:34px 1fr;gap:0 6px;margin:0 0 .6em}
  .who{font-family:var(--sans);font-size:11.5px;font-weight:700;color:var(--accent);padding-top:.38em;letter-spacing:.02em}
  .people .say{font-weight:700}
  .gap{display:block;height:.6em}
  .say .l{display:block;padding-left:1em;text-indent:-1em}
  .say .l.in{padding-left:2em}
  .rubric{font-family:var(--sans);font-size:13.5px;line-height:1.45;font-style:italic;color:var(--muted);margin:.2em 0 .7em 40px}
  .or{font-family:var(--sans);font-size:13px;font-style:italic;color:var(--muted);margin:-.1em 0 .5em 40px}
  .lines h4{font-family:var(--sans);font-size:13px;font-weight:700;color:var(--fg);margin:1.1em 0 .5em 40px}
</style>
</head>
<body>
<div id="view-readings" role="tabpanel" aria-labelledby="tab-readings">
<header>
  <div class="nav">
    <button id="prev" aria-label="Previous day">‹</button>
    <div class="when">
      <div class="date" id="date">&nbsp;</div>
      <button class="today-link" id="today">Back to today</button>
    </div>
    <button id="next" aria-label="Next day">›</button>
  </div>
</header>
<main>
  <div id="content"><div class="status">Loading today's readings…</div></div>
  <footer id="footer"></footer>
</main>
</div>
<div id="view-parts" role="tabpanel" aria-labelledby="tab-parts" hidden>
<header>
  <div class="title">The Order of Mass</div>
  <nav class="jump" id="jump" aria-label="Jump to section"></nav>
</header>
<main>
  <p class="parts-intro"><b>P</b> = Priest · <b>D</b> = Deacon (or Priest) · <b>R</b> = Reader · <b>All</b> = People (in bold)</p>
  <div id="parts-content"></div>
  <footer>Excerpts from the English translation of The Roman Missal © 2010, International Commission on English in the Liturgy Corporation. All rights reserved.</footer>
</main>
</div>
<nav class="tabbar" role="tablist" aria-label="Sections">
  <button id="tab-readings" role="tab" aria-selected="true" aria-controls="view-readings" data-view="readings">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6.5C10 5 7 4.5 3.5 4.8v13c3.5-.3 6.5.2 8.5 1.7 2-1.5 5-2 8.5-1.7v-13C17 4.5 14 5 12 6.5z"/><path d="M12 6.5v13"/></svg>
    Readings</button>
  <button id="tab-parts" role="tab" aria-selected="false" aria-controls="view-parts" data-view="parts">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18M7 8h10"/><path d="M5 21h14"/></svg>
    Mass Parts</button>
</nav>
<script>
(() => {
  const EVZ = 'https://feed.evangelizo.org/v2/reader.php';
  const UNI = d => `https://universalis.com/usa/${d}/jsonpmass.js`;
  const $ = id => document.getElementById(id);
  let current = null, loadToken = 0;

  // ---------- date helpers (device-local date) ----------
  const ymd = d => `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
  const today = () => { const d = new Date(); d.setHours(12,0,0,0); return d; };
  const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
  const sameDay = (a,b) => ymd(a) === ymd(b);
  const fmtDate = d => d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});

  // ---------- text helpers ----------
  const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const decode = s => { const t = document.createElement('textarea'); t.innerHTML = s; return t.value; };
  const clean = s => decode(String(s||'').replace(/<br\s*\/?>/gi,'\n').replace(/<\/(div|p)>/gi,'\n').replace(/<[^>]+>/g,''))
                       .replace(/\u00a0/g,' ').replace(/[ \t]+\n/g,'\n').replace(/\n{3,}/g,'\n\n').trim();
  const proseParas = s => s.split(/\n+/).map(p => p.trim()).filter(Boolean).map(p => `<p>${esc(p)}</p>`).join('');
  const paras = s => s.split(/\n\s*\n/).map(p => `<p>${esc(p.trim()).replace(/\n/g,'<br>')}</p>`).join('');
  // "Ps 33(32),1-2.4-5." -> "Ps 33:1-2, 4-5"
  const cite = s => { s = clean(s).replace(/\.$/,'').replace(/^(Ps\w*\s+\d+)\(\d+\)/,'$1');
                      return s.replace(/(\d+),/, '$1:').replace(/\.(?=\d)/g, ', '); };

  // ---------- sources ----------
  async function fetchEvangelizo(d){
    const r = await fetch(`${EVZ}?date=${d}&type=xml&lang=AM`, {cache:'no-cache'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const xml = await r.text();
    if(!/<evangelizo>/.test(xml)) throw new Error('No data for this date');
    const tag = n => { const m = xml.match(new RegExp(`<${n}>\\s*<!\\[CDATA\\[([\\s\\S]*?)\\]\\]>\\s*</${n}>`)); return m ? m[1].trim() : ''; };
    const reading = (k) => ({ cite: cite(tag(`reading_${k}_st`)), text: clean(tag(`reading_${k}`)) });
    const out = { day: clean(tag('litugic_t')), saint: clean(tag('saint')),
      r1: reading('text1'), ps: reading('text2'), r2: reading('text3'), g: reading('gospel') };
    if(!out.g.text) throw new Error('Empty readings');
    return out;
  }

  // Universalis JSONP uses a fixed callback name, so serialize calls.
  let uniQueue = Promise.resolve();
  function fetchUniversalis(d){
    const job = uniQueue.then(() => new Promise((resolve,reject) => {
      const s = document.createElement('script');
      const done = (fn,v) => { clearTimeout(t); delete window.universalisCallback; s.remove(); fn(v); };
      const t = setTimeout(() => done(reject, new Error('timeout')), 12000);
      window.universalisCallback = data => done(resolve, data);
      s.onerror = () => done(reject, new Error('load error'));
      s.src = UNI(d); document.head.appendChild(s);
    }));
    uniQueue = job.catch(()=>{});
    return job;
  }
  const uniLines = html => { const doc = new DOMParser().parseFromString(html||'','text/html');
    const divs = [...doc.body.querySelectorAll('div')];
    return divs.length ? divs.map(x => x.textContent.replace(/\u00a0/g,' ').trim()) : [doc.body.textContent.trim()]; };
  const uniText = (html, prose) => { const L = uniLines(html); return prose ? L.join('\n\n') : L.join('\n'); };
  function uniPsalm(html){ // first italic line = response; stanzas split by margin-top divs
    const doc = new DOMParser().parseFromString(html||'','text/html');
    let response = '', out = [];
    doc.body.querySelectorAll('div').forEach((div,i) => {
      const txt = div.textContent.replace(/\u00a0/g,' ').trim();
      if(i===0 && div.querySelector('i')){ response = txt; return; }
      if(div.querySelector('i') && txt === response){ out.push('\n'); return; } // repeated response marks stanza
      if(/margin-top/.test(div.getAttribute('style')||'') && out.length) out.push('\n');
      out.push(txt);
    });
    return { response, text: out.join('\n').replace(/\n\n\n+/g,'\n\n').trim() };
  }
  const bookKey = c => { const m = clean(c).match(/^([1-3]?\s*[A-Za-z]{3})\w*\s+(\d+)/); return m ? (m[1].replace(/\s/g,'').toLowerCase()+m[2]) : ''; };

  // ---------- cache ----------
  const cacheGet = k => { try { return JSON.parse(localStorage.getItem('mr:'+k)); } catch { return null; } };
  const cacheSet = (k,v) => { try {
      localStorage.setItem('mr:'+k, JSON.stringify(v));
      const keys = Object.keys(localStorage).filter(x=>x.startsWith('mr:')).sort();
      while(keys.length > 14) localStorage.removeItem(keys.shift());
    } catch {} };

  async function getReadings(d){
    const key = ymd(d);
    const cached = cacheGet(key);
    if(cached && cached.v === 2) return cached;
    const [evz, uni] = await Promise.allSettled([fetchEvangelizo(key), fetchUniversalis(key)]);
    let data;
    if(evz.status === 'fulfilled'){
      const e = evz.value;
      data = { v:2, src:'usccb', day:e.day, saint:e.saint, r1:e.r1, ps:{...e.ps, response:''}, r2:e.r2, ga:null, g:e.g };
      if(uni.status === 'fulfilled'){
        const u = uni.value;
        // Only borrow the psalm response + acclamation if both sources agree on the Gospel.
        if(u.Mass_G && bookKey(u.Mass_G.source) === bookKey(e.g.cite)){
          if(u.Mass_Ps) data.ps.response = uniPsalm(u.Mass_Ps.text).response;
          if(u.Mass_GA) data.ga = { cite: clean(u.Mass_GA.source).replace(/^cf\.\s*/i,'cf. ').replace(/([A-Za-z])(\d)/,'$1 $2'), text: uniText(u.Mass_GA.text) };
          data.mixed = true;
        }
      }
    } else if(uni.status === 'fulfilled'){
      const u = uni.value, dayLines = uniLines(u.day);
      const ps = u.Mass_Ps ? uniPsalm(u.Mass_Ps.text) : {response:'',text:''};
      const rd = x => x ? { cite: clean(x.source), text: uniText(x.text, true) } : {cite:'',text:''};
      data = { v:2, src:'universalis', day: dayLines[0]||'', saint: (dayLines[1]||'').replace(/^or\s+/,''),
        r1: rd(u.Mass_R1), ps: { cite: u.Mass_Ps ? clean(u.Mass_Ps.source) : '', text: ps.text, response: ps.response },
        r2: rd(u.Mass_R2), ga: u.Mass_GA ? { cite: clean(u.Mass_GA.source), text: uniText(u.Mass_GA.text) } : null, g: rd(u.Mass_G) };
    } else {
      throw evz.reason || uni.reason;
    }
    cacheSet(key, data);
    return data;
  }

  // ---------- render ----------
  function section(cls, title, r, extra=''){
    const prose = cls==='reading' || cls==='gospel';
    if(!r || !r.text) return '';
    return `<section class="${cls}"><h2>${title}</h2>${r.cite?`<div class="cite">${esc(r.cite)}</div>`:''}${extra}<div class="text${prose?' prose':''}">${prose?proseParas(r.text):paras(r.text)}</div></section>`;
  }
  function render(data){
    const resp = data.ps.response ? `<p class="response"><b>R.</b>${esc(data.ps.response)}</p>` : '';
    const saint = data.saint && !data.day.toLowerCase().includes(data.saint.toLowerCase().slice(0,12)) ? `<p class="memorial">${esc(data.saint)}</p>` : '';
    $('content').innerHTML =
      `<h1>${esc(data.day || 'Readings of the Day')}</h1>${saint}` +
      section('reading','First Reading', data.r1) +
      section('psalm','Responsorial Psalm', data.ps, resp) +
      section('reading','Second Reading', data.r2) +
      section('acclamation','Gospel Acclamation', data.ga) +
      section('gospel','Gospel', data.g);
    $('footer').innerHTML = data.src === 'usccb'
      ? `Scripture texts from the Lectionary for Mass (USA), © Confraternity of Christian Doctrine, via <a href="https://dailygospel.org/AM/gospel">Evangelizo / DailyGospel.org</a>.` +
        (data.mixed ? `<br>Psalm response &amp; acclamation via <a href="https://universalis.com">Universalis</a> (may differ in wording).` : '') +
        `<br><a href="https://bible.usccb.org/bible/readings/${usccbCode(current)}.cfm">Open on USCCB.org</a>`
      : `Readings via <a href="https://universalis.com">Universalis</a> (Jerusalem Bible / Grail Psalms). © Universalis Publishing Ltd.` +
        `<br><a href="https://bible.usccb.org/bible/readings/${usccbCode(current)}.cfm">Open USCCB version</a>`;
  }
  const usccbCode = d => `${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}${String(d.getFullYear()).slice(2)}`;

  async function show(d){
    current = d; const token = ++loadToken;
    $('date').textContent = fmtDate(d);
    $('today').classList.toggle('show', !sameDay(d, today()));
    if(view === 'readings') document.title = sameDay(d, today()) ? 'Mass Readings · Today' : 'Mass Readings · ' + d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
    $('content').innerHTML = `<div class="status">Loading readings…</div>`; $('footer').innerHTML = '';
    try {
      const data = await getReadings(d);
      if(token !== loadToken) return;
      render(data); if(view === 'readings') window.scrollTo(0,0);
    } catch(err){
      if(token !== loadToken) return;
      $('content').innerHTML = `<div class="status">Couldn't load the readings${navigator.onLine?'':' (you appear to be offline)'}.<br>
        ${Math.abs((d - today())/864e5) > 25 ? '<small>The free feeds only cover about a month around today.</small><br>' : ''}
        <button id="retry">Try again</button><br><br><a href="https://bible.usccb.org/bible/readings/${usccbCode(d)}.cfm" style="color:var(--accent)">Open on USCCB.org</a></div>`;
      $('retry').onclick = () => show(d);
    }
    // quietly prefetch neighbours
    if(token === loadToken) [1,-1].forEach(n => getReadings(addDays(d,n)).catch(()=>{}));
  }

  // ---------- Order of Mass (Roman Missal, 3rd ed., USA, 2011) ----------
  // Line format: [role, text]. Roles: P = Priest, D = Deacon or Priest, R = Reader, A = All/People, '' = rubric, 'or' = "Or:", 'h' = sub-heading
  const ORDER = [
   { id:'intro', title:'Introductory Rites', parts:[
    { t:'Sign of the Cross', l:[
      ['P','In the name of the Father, and of the Son, and of the Holy Spirit.'],
      ['A','Amen.'] ]},
    { t:'Greeting', l:[
      ['P','The grace of our Lord Jesus Christ,\nand the love of God,\nand the communion of the Holy Spirit\nbe with you all.'],
      ['or'],
      ['P','Grace to you and peace from God our Father\nand the Lord Jesus Christ.'],
      ['or'],
      ['P','The Lord be with you.'],
      ['A','And with your spirit.'],
      ['','A Bishop, instead of “The Lord be with you,” says: Peace be with you.'] ]},
    { t:'Penitential Act', l:[
      ['P','Brethren (brothers and sisters), let us acknowledge our sins,\nand so prepare ourselves to celebrate the sacred mysteries.'],
      ['','A brief pause for silence follows. One of these forms is used:'],
      ['h','Form A · I Confess (Confiteor)'],
      ['A','I confess to almighty God\nand to you, my brothers and sisters,\nthat I have greatly sinned,\nin my thoughts and in my words,\nin what I have done and in what I have failed to do,'],
      ['','And, striking their breast, they say:'],
      ['A','through my fault, through my fault,\nthrough my most grievous fault;'],
      ['','Then they continue:'],
      ['A','therefore I ask blessed Mary ever-Virgin,\nall the Angels and Saints,\nand you, my brothers and sisters,\nto pray for me to the Lord our God.'],
      ['h','Form B'],
      ['P','Have mercy on us, O Lord.'],
      ['A','For we have sinned against you.'],
      ['P','Show us, O Lord, your mercy.'],
      ['A','And grant us your salvation.'],
      ['h','Form C'],
      ['','The Priest, Deacon, or another minister says these or other invocations:'],
      ['P','You were sent to heal the contrite of heart:\nLord, have mercy.'],
      ['A','Lord, have mercy.'],
      ['P','You came to call sinners:\nChrist, have mercy.'],
      ['A','Christ, have mercy.'],
      ['P','You are seated at the right hand of the Father to intercede for us:\nLord, have mercy.'],
      ['A','Lord, have mercy.'],
      ['h','Absolution (after any form)'],
      ['P','May almighty God have mercy on us,\nforgive us our sins,\nand bring us to everlasting life.'],
      ['A','Amen.'] ]},
    { t:'Kyrie (Lord, have mercy)', l:[
      ['','Follows unless it was already used in Form C above.'],

    { t:'Nicene Creed', l:[
      ['','On Sundays and solemnities, after the homily:'],
      ['A','I believe in one God,\nthe Father almighty,\nmaker of heaven and earth,\nof all things visible and invisible.\n\nI believe in one Lord Jesus Christ,\nthe Only Begotten Son of God,\nborn of the Father before all ages.\nGod from God, Light from Light,\ntrue God from true God,\nbegotten, not made, consubstantial with the Father;\nthrough him all things were made.\nFor us men and for our salvation\nhe came down from heaven,'],

   { id:'communion', title:'Communion Rite', parts:[

      ['P','At the Savior’s command\nand formed by divine teaching,\nwe dare to say:'],
      ['A','Our Father, who art in heaven,\nhallowed be thy name;\nthy kingdom come,\nthy will be done\non earth as it is in heaven.\nGive us this day our daily bread,\nand forgive us our trespasses,\nas we forgive those who trespass against us;\nand lead us not into temptation,\nbut deliver us from evil.'],
      ['P','Deliver us, Lord, we pray, from every evil,\ngraciously grant peace in our days,\nthat, by the help of your mercy,\nwe may be always free from sin\nand safe from all distress,\nas we await the blessed hope\nand the coming of our Savior, Jesus Christ.'],

  ];
  const ROLE = { P:'P', D:'D', R:'R', A:'All' };
  const ROLE_TITLE = { P:'Priest', D:'Deacon or Priest', R:'Reader', A:'All (People)' };
  function renderParts(){
    const line = ([r,t]) => {
      if(r==='or') return `<div class="or">Or:</div>`;
      if(r==='h') return `<h4>${esc(t)}</h4>`;
      if(!r) return `<div class="rubric">${esc(t)}</div>`;
      return `<div class="ln ${r==='A'?'people':'priest'}"><span class="who" title="${ROLE_TITLE[r]}">${ROLE[r]}</span><div class="say">${t.split('\n').map(x => x ? `<span class="l${x.startsWith('    ')?' in':''}">${esc(x.trim())}</span>` : '<span class="gap"></span>').join('')}</div></div>`;
    };
    $('parts-content').innerHTML = ORDER.map(s =>
      `<div class="rite" id="rite-${s.id}"><h3>${esc(s.title)}</h3>` +
      s.parts.map(p => `<details open><summary>${esc(p.t)}</summary><div class="lines">${p.l.map(line).join('')}</div></details>`).join('') +
      `</div>`).join('');
    $('jump').innerHTML = ORDER.map(s => `<button data-id="${s.id}">${esc(s.title.replace('Liturgy of the ','').replace(' Rites','').replace(' Rite',''))}</button>`).join('');
    $('jump').onclick = e => { const b = e.target.closest('button'); if(!b) return;
      const el = $('rite-'+b.dataset.id), hh = document.querySelector('#view-parts header').offsetHeight;
      window.scrollTo({ top: el.getBoundingClientRect().top + scrollY - hh - 6, behavior:'smooth' }); };
  }

  // ---------- tabs ----------
  const TAB_KEY = 'massTab';  // not "mr:" — that prefix is pruned by the readings cache
  const scrollPos = { readings:0, parts:0 };
  let view = 'readings', partsReady = false;
  function setView(v, restore){
    if(v !== 'parts') v = 'readings';
    if(v === view && restore === undefined) return;
    scrollPos[view] = scrollY;
    view = v;
    if(v === 'parts' && !partsReady){ renderParts(); partsReady = true; }
    $('view-readings').hidden = v !== 'readings';
    $('view-parts').hidden = v !== 'parts';
    document.querySelectorAll('.tabbar button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.view === v)));
    if(v === 'parts') document.title = 'Mass Parts';
    else if(current) document.title = sameDay(current, today()) ? 'Mass Readings · Today' : 'Mass Readings · ' + current.toLocaleDateString('en-US',{month:'short',day:'numeric'});
    window.scrollTo(0, restore ? 0 : scrollPos[v]);
    try { localStorage.setItem(TAB_KEY, v); } catch {}
  }
  document.querySelector('.tabbar').onclick = e => { const b = e.target.closest('button'); if(!b) return;
    if(b.dataset.view === view) window.scrollTo({top:0, behavior:'smooth'}); else setView(b.dataset.view); };

  $('prev').onclick = () => show(addDays(current,-1));
  $('next').onclick = () => show(addDays(current, 1));
  $('today').onclick = () => show(today());
  document.addEventListener('keydown', e => { if(view !== 'readings') return; if(e.key==='ArrowLeft') $('prev').click(); if(e.key==='ArrowRight') $('next').click(); });
  // swipe left/right to change day
  let sx=null, sy=null;
  addEventListener('touchstart', e => { if(view !== 'readings'){ sx=null; return; } sx=e.touches[0].clientX; sy=e.touches[0].clientY; }, {passive:true});
  addEventListener('touchend', e => { if(sx===null) return; const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy;
    if(Math.abs(dx)>70 && Math.abs(dx)>Math.abs(dy)*2) (dx<0?$('next'):$('prev')).click(); sx=null; }, {passive:true});
  // When reopened on a new day, jump to that day's readings.
  let lastToday = ymd(today()), wasOnToday = true;
  document.addEventListener('visibilitychange', () => {
    if(document.visibilityState !== 'visible') { wasOnToday = sameDay(current, today()) || ymd(current) === lastToday; return; }
    const t = ymd(today()); if(t !== lastToday){ lastToday = t; if(wasOnToday) show(today()); }
  });

  const q = new URLSearchParams(location.search).get('date');
  let saved = null; try { saved = localStorage.getItem(TAB_KEY); } catch {}
  setView(q ? 'readings' : saved, true);
  show(q && /^\d{8}$/.test(q) ? new Date(+q.slice(0,4), +q.slice(4,6)-1, +q.slice(6,8), 12) : today());
  if('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
